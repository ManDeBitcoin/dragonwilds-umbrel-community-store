services:
  app_proxy:
    environment:
      APP_HOST: dragonwilds-server_app_1
      APP_PORT: 8080

  app:
    # Release checklist: pin the published tag with its manifest digest before adding this store to Umbrel.
    image: ghcr.io/mandebitcoin/dragonwilds-umbrel:0.1.18
    restart: on-failure


    stop_grace_period: 1m
    ports:
      - "23409:23409/udp"
      - "24520:24520/udp"
    environment:
      WEB_PORT: "8080"
      GAME_PORT: "23409"
      ADMIN_PASSWORD: "${APP_PASSWORD}"
      SESSION_SECRET: "${APP_SEED}"
    volumes:
      - ${APP_DATA_DIR}/data/control:/data/control
      - ${APP_DATA_DIR}/data/server:/home/steam/rsdw-dedicated
      - ${APP_DATA_DIR}/data/backups:/data/backups
      - ${APP_DATA_DIR}/data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
