services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "8080:8080/tcp"
      - "23409:23409/udp"
      - "24520:24520/udp"
    environment:
      WEB_PORT: "8080"
      GAME_PORT: "23409"
      ADMIN_PASSWORD: "change-this-development-password"
      SESSION_SECRET: "change-this-development-session-secret"
    volumes:
      - ./dev-data/control:/data/control
      - ./dev-data/server:/home/steam/rsdw-dedicated
      - ./dev-data/backups:/data/backups
      - ./dev-data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
